User:
  type: object
  additionalProperties: false
  required:
    - id
    - email
    - fullName
    - zepUsername
    - releaseDate
    - roles
    - personioId
    - isExternal
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      type: string
    zepUsername:
      type: string
    releaseDate:
      type: string
      format: date
      nullable: true
    roles:
      type: array
      items:
        $ref: './shared.yaml#/Role'
    personioId:
      type: integer
      format: int32
      nullable: true
    isExternal:
      type: boolean
ActiveUser:
  type: object
  additionalProperties: false
  required:
    - userId
    - fullName
    - email
    - releaseDate
  properties:
    userId:
      type: string
      format: uuid
    fullName:
      type: string
    email:
      type: string
      format: email
    releaseDate:
      type: string
      format: date
      nullable: true
UpdateReleaseDateEntry:
  type: object
  additionalProperties: false
  required:
    - userId
    - releaseDate
  properties:
    userId:
      type: string
      format: uuid
    releaseDate:
      type: string
      format: date
UpdateReleaseDatesRequest:
  type: object
  additionalProperties: false
  required:
    - entries
  properties:
    entries:
      type: array
      items:
        $ref: '#/UpdateReleaseDateEntry'
UpdateReleaseDatesResponse:
  type: object
  additionalProperties: false
  required:
    - failedUserIds
  properties:
    failedUserIds:
      type: array
      items:
        type: string
        format: uuid
InternalRateUploadProblem:
  description: >-
    Problem returned when an internal-rate CSV upload is rejected; `code` identifies the reason.
  allOf:
    - $ref: './shared.yaml#/Problem'
    - type: object
      required:
        - lines
      properties:
        lines:
          type: array
          description: 1-based line numbers of the offending CSV rows; empty when the failure concerns no specific row.
          items:
            type: integer
            format: int32
