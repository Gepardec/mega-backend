MonthValue:
  type: string
  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
  example: '2026-03'
Role:
  type: string
  description: >-
    A role a user can hold. Mirrors the shared domain `Role` enum, including the
    `SYSTEM` role held by the seeded system actor.
  enum:
    - EMPLOYEE
    - OFFICE_MANAGEMENT
    - PROJECT_LEAD
    - SYSTEM
ApiError:
  type: object
  additionalProperties: false
  required:
    - message
  properties:
    message:
      type: string
      nullable: true
      description: Human-readable error message when available.
ProjectRef:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - zepUrl
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    zepUrl:
      type: string
      nullable: true
UserRef:
  type: object
  additionalProperties: false
  required:
    - id
    - fullName
    - zepUrl
  properties:
    id:
      type: string
      format: uuid
    fullName:
      type: string
    zepUrl:
      type: string
      nullable: true
