MonthValue:
  type: string
  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
  example: '2026-03'
Role:
  type: string
  description: >-
    A role a user can hold. Mirrors the shared domain `Role` enum, including the
    `SYSTEM` role held by the seeded system actor.
  enum:
    - EMPLOYEE
    - OFFICE_MANAGEMENT
    - PROJECT_LEAD
    - PROJECT_COORDINATOR
    - ADMIN
    - SYSTEM
Capacity:
  type: string
  description: >-
    The capacity a caller acts in when reading data, named after the UI page it
    serves. `EMPLOYEE` requires the employee role, `CONTROLLING` requires the
    project-lead role. Capacity shapes reads only and is never accepted by
    commands.
  enum:
    - EMPLOYEE
    - CONTROLLING
ApiError:
  type: object
  additionalProperties: false
  required:
    - message
  properties:
    message:
      type: string
      nullable: true
      description: Human-readable error message when available.
ProjectRef:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - zepUrl
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    zepUrl:
      type: string
UserRef:
  type: object
  additionalProperties: false
  required:
    - id
    - fullName
    - zepUrl
  properties:
    id:
      type: string
      format: uuid
    fullName:
      type: string
    zepUrl:
      type: string
      nullable: true
