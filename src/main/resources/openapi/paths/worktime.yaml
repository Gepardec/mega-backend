'/worktime/{payrollMonth}':
  get:
    tags:
      - WorkTime
    operationId: getWorkTimeReport
    summary: Get the authenticated actor's work time report for a payroll month in the requested capacity
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/PayrollMonthPathParameter'
      - name: capacity
        in: query
        required: true
        description: The capacity the report is read in.
        schema:
          $ref: '../schemas/shared.yaml#/Capacity'
    responses:
      '200':
        description: >-
          Work time report. The order of entries is not defined; grouping and
          sorting is up to the client.
        content:
          application/json:
            schema:
              $ref: '../schemas/worktime.yaml#/WorkTimeReport'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/worktime/warnings/{payrollMonth}':
  get:
    tags:
      - WorkTime
    operationId: getEmployeeWarnings
    summary: Get the authenticated employee's work time warnings for a payroll month
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/PayrollMonthPathParameter'
    responses:
      '200':
        description: Employee work time warnings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/worktime.yaml#/WorkTimeWarning'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
/worktime/warning-rules:
  get:
    tags:
      - WorkTimeWarningRules
    operationId: listWarningRuleSettings
    summary: List the settings of all work time warning rules
    security:
      - bearerAuth: [ ]
    responses:
      '200':
        description: One setting per warning rule
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/worktime.yaml#/WarningRuleSetting'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/worktime/warning-rules/{rule}':
  put:
    tags:
      - WorkTimeWarningRules
    operationId: updateWarningRuleSetting
    summary: Replace the setting of one work time warning rule
    security:
      - bearerAuth: [ ]
    parameters:
      - name: rule
        in: path
        required: true
        description: Identifier of the warning rule.
        schema:
          $ref: '../schemas/worktime.yaml#/WarningRule'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/worktime.yaml#/WarningRuleSettingUpdate'
    responses:
      '200':
        description: Updated rule setting
        content:
          application/json:
            schema:
              $ref: '../schemas/worktime.yaml#/WarningRuleSetting'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '404':
        $ref: '../responses/common.yaml#/NotFound'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
