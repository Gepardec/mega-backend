'/projects/settings':
  get:
    tags:
      - Project
    operationId: getProjectSettings
    summary: Get Leistungsnachweis settings of projects led by user
    security:
      - bearerAuth: [ ]
    responses:
      '200':
        description: List of project settings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/projects.yaml#/ProjectSettings'
      '403': { $ref: '../responses/common.yaml#/Forbidden' }
'/projects/{projectId}/leistungsnachweis-enabled':
  put:
    tags:
      - Project
    operationId: setLeistungsnachweisEnabled
    summary: Toggle leistungsnachweis flag
    security:
      - bearerAuth: [ ]
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/projects.yaml#/LeistungsnachweisToggleRequest'
    responses:
      '204': { description: Flag updated }
      '400': { $ref: '../responses/common.yaml#/BadRequest' }
      '403': { $ref: '../responses/common.yaml#/Forbidden' }
      '404': { $ref: '../responses/common.yaml#/NotFound' }


