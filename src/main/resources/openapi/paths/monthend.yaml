'/monthend/payroll-month':
  get:
    tags:
      - MonthEnd
    operationId: getPayrollMonth
    summary: Get the authenticated actor's payroll month in the requested capacity
    security:
      - bearerAuth: [ ]
    parameters:
      - name: capacity
        in: query
        required: true
        description: The capacity the payroll month is resolved for.
        schema:
          $ref: '../schemas/shared.yaml#/Capacity'
    responses:
      '200':
        description: Payroll month
        content:
          application/json:
            schema:
              type: string
              format: year-month
              example: "2026-09"
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/{month}/status-overview':
  get:
    tags:
      - MonthEnd
    operationId: getMonthEndStatusOverview
    summary: Get the authenticated actor's month-end status overview in the requested capacity
    security:
      - bearerAuth: [ ]
    parameters:
      - name: month
        in: path
        required: true
        description: Month-end context in yyyy-MM format.
        schema:
          type: string
          format: year-month
          example: "2026-09"
      - name: capacity
        in: query
        required: true
        description: The capacity the overview is read in.
        schema:
          $ref: '../schemas/shared.yaml#/Capacity'
    responses:
      '200':
        description: Month-end status overview
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndStatusOverview'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/generate-prematurely':
  post:
    tags:
      - MonthEnd
    operationId: generateMonthEndPrematurely
    summary: Generate the authenticated actor's month-end project contexts prematurely
    security:
      - bearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/monthend.yaml#/GenerateMonthEndPrematurelyRequest'
    responses:
      '204':
        description: Prepared month-end project contexts
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/clarifications':
  post:
    tags:
      - MonthEnd
    operationId: createMonthEndClarification
    summary: Create a month-end clarification for the authenticated actor
    description: >-
      The subject is taken only from subjectEmployeeId and is never inferred from the caller.
      An omitted or null subjectEmployeeId creates a project-level clarification, which only an
      eligible project lead of the project may create. A non-lead may name only themselves.
      Every other request is rejected with 403.
    security:
      - bearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/monthend.yaml#/CreateClarificationRequest'
    responses:
      '201':
        description: Created clarification
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndOverviewClarificationEntry'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/tasks/{taskId}/complete':
  post:
    tags:
      - MonthEnd
    operationId: completeMonthEndTask
    summary: Complete a month-end task for the authenticated actor
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/TaskIdPathParameter'
    responses:
      '200':
        description: Completed or unchanged task state
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndTask'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '404':
        $ref: '../responses/common.yaml#/NotFound'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/clarifications/{clarificationId}':
  delete:
    tags:
      - MonthEnd
    operationId: deleteMonthEndClarification
    summary: Delete an open month-end clarification (creator only)
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/ClarificationIdPathParameter'
    responses:
      '204':
        description: Clarification deleted
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '404':
        $ref: '../responses/common.yaml#/NotFound'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/clarifications/{clarificationId}/text':
  put:
    tags:
      - MonthEnd
    operationId: updateMonthEndClarificationText
    summary: Update month-end clarification text for the authenticated actor
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/ClarificationIdPathParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/monthend.yaml#/UpdateClarificationTextRequest'
    responses:
      '200':
        description: Updated clarification
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndOverviewClarificationEntry'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '404':
        $ref: '../responses/common.yaml#/NotFound'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/clarifications/{clarificationId}/resolve':
  post:
    tags:
      - MonthEnd
    operationId: resolveMonthEndClarification
    summary: Resolve a month-end clarification for the authenticated actor
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../parameters/common.yaml#/ClarificationIdPathParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/monthend.yaml#/ResolveClarificationRequest'
    responses:
      '200':
        description: Resolved or unchanged clarification state
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndOverviewClarificationEntry'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '404':
        $ref: '../responses/common.yaml#/NotFound'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/{month}/generate':
  post:
    tags:
      - Cron
    operationId: generateMonthEndTasks
    summary: Generate month-end tasks for a month
    security:
      - mega-cron: [ ]
    parameters:
      - name: month
        in: path
        required: true
        description: Month-end context in yyyy-MM format.
        schema:
          type: string
          format: year-month
          example: "2026-09"
    responses:
      '200':
        description: Month-end generation result
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndTaskGeneration'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
'/monthend/{month}/projects/{projectId}/tasks/complete':
  post:
    tags:
      - MonthEnd
    operationId: completeProjectLeadMonthEndTasks
    summary: Complete all tasks of one type for a project as a project lead or coordinator
    security:
      - bearerAuth: [ ]
    parameters:
      - name: month
        in: path
        required: true
        description: Month-end context in yyyy-MM format.
        schema:
          type: string
          format: year-month
          example: "2026-09"
      - name: projectId
        in: path
        required: true
        description: Project whose tasks are completed.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/monthend.yaml#/CompleteProjectLeadMonthEndTasksRequest'
    responses:
      '200':
        description: Monthend tasks bulk completed
        content:
          application/json:
            schema:
              $ref: '../schemas/monthend.yaml#/MonthEndTaskCompletion'
      '400':
        $ref: '../responses/common.yaml#/BadRequest'
      '403':
        $ref: '../responses/common.yaml#/Forbidden'
      '500':
        $ref: '../responses/common.yaml#/InternalServerError'
