name: Build, Test and Release Containerimage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# cancel outdated runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write # push container image to ghcr.io
  checks: write # publish test report

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: checkout

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (and test) project with Maven
        run: mvn -B package --file pom.xml

      # annotate failing tests on the PR / commit
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: 'target/surefire-reports/TEST-*.xml'

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # push the code coverage report to codacy (secrets are not available for PRs from forks)
      - name: generate coverage report
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          # report PR coverage against the head commit instead of the generated merge commit
          COMMIT_UUID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export CODACY_PROJECT_TOKEN=${{secrets.CODACY_PROJECT_TOKEN}}
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r target/jacoco-report/jacoco.xml --commit-uuid "$COMMIT_UUID"

      # set the env.COMMIT variable
      - if: github.event_name != 'pull_request'
        run: echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # build the container image and release it as a package in this repository
      - uses: mr-smithers-excellent/docker-build-push@v7
        name: push-container-image
        if: github.event_name != 'pull_request'
        with:
          image: mega-backend
          registry: ghcr.io
          dockerfile: Containerfile
          buildArgs: COMMIT=${{ env.COMMIT }}, BRANCH=${{ github.ref_name }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # if the branch is main, add the latest tag
          addLatest: ${{ github.ref == 'refs/heads/main' }}
